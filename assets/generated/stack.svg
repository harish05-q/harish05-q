<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="570" viewBox="0 0 1280 570" role="img" aria-labelledby="t d">
<title id="t">Tech stack</title><desc id="d">Languages: Python, C++, Java, JavaScript, TypeScript. Backend &amp; Data: FastAPI, Node.js, Express.js, REST APIs, Auth, API Design, Concurrency, PostgreSQL, MySQL, MongoDB. Frontend: React.js, Next.js, Tailwind CSS, React Flow. AI / LLM: Generative AI, LLMs, RAG, LangChain, Agentic Systems, Embeddings, Semantic Retrieval, FAISS, Qdrant, n8n. Infra &amp; Tooling: Docker, AWS, Linux, GitHub Actions, Git, GitHub. Core CS: DSA, OOP, Operating Systems, DBMS, Computer Networks, System Design</desc>
