@keyframes gin{0%{opacity:0}6%,88%{opacity:1}96%,100%{opacity:0}}@keyframes ring{0%,40%{opacity:0;stroke-width:2}55%{opacity:.9;stroke-width:6}75%,100%{opacity:0;stroke-width:2}}@keyframes gb{0%,42%{opacity:0;transform:translate(0,6px)}50%,88%{opacity:1;transform:translate(0,0)}96%,100%{opacity:0}}
@media (prefers-reduced-motion:no-preference){.gn,.ge{animation:gin 8s ease-out infinite both}.hring{animation:ring 2.6s ease-out infinite}.gb{animation:gb 8s ease-out infinite}}
