<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" role="img" aria-labelledby="t d">
<title id="t">MarketIQ: Market intelligence from financial news: collect, enrich, connect and explore with RAG.</title><desc id="d">Stack: FastAPI, Kafka, Qdrant, PostgreSQL, Next.js. Signature stage: observe.</desc>
<style>:root{--bg:#FFF6F8;--surface:#FFFFFF;--surface-alt:#F3FBF7;--border:#F1D6E0;--grid:#F6E4EB;--ink:#1B1B1F;--muted:#6B6870;--subtle:#9A96A0;--subtle-ink:#706C76;--green:#129A6A;--green-ink:#0B7A53;--green-soft:#BFEBD7;--pink:#E0457B;--pink-ink:#C2255C;--pink-soft:#FAD3E1}
.s{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
@keyframes flow{0%{transform:translate(70px,230px);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translate(415px,230px);opacity:0}}@keyframes draw{0%{stroke-dashoffset:200}60%,100%{stroke-dashoffset:0}}@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.fd{animation:flow 3.6s linear infinite}.fd1{animation-delay:-1.2s}.fd2{animation-delay:-2.4s}.tk{animation:draw 6s ease-out infinite}.tkd{animation:blink 2s ease-in-out infinite}</style>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
<feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#E0457B" flood-opacity=".06"/>
<feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#129A6A" flood-opacity=".06"/></filter></defs>
