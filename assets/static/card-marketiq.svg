<rect x="8" y="8" width="604" height="284" rx="16" fill="#FFFFFF" stroke="#F1D6E0" stroke-width="1.5" filter="url(#sh)"/>
<text x="30" y="54" class="s" font-size="32" fill="#129A6A" font-weight="700">MarketIQ</text>
<text x="590" y="50" class="m" font-size="20" fill="#C2255C" text-anchor="end">live demo ↗</text>
<text x="30" y="90" class="s" font-size="20" fill="#6B6870">Market intelligence from financial news: collect, enrich,</text><text x="30" y="116" class="s" font-size="20" fill="#6B6870">connect and explore with RAG.</text>
