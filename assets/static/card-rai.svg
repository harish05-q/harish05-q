.lp{animation:lp 8s linear infinite}.lg{animation:lg 8s linear infinite}.ln0{animation:lf0 8s linear infinite}.ln1{animation:lf1 8s linear infinite}.ln2{animation:lf2 8s linear infinite}.ln3{animation:lf3 8s linear infinite}.ln4{animation:lf4 8s linear infinite}.ln5{animation:lf5 8s linear infinite}</style>
