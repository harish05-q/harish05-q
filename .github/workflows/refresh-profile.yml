name: Refresh profile visuals

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build static visuals
        run: node scripts/build-static.js

      - name: Build dynamic visuals
        env:
          # Optional PAT (read:user) for the contributions query; falls back to GITHUB_TOKEN,
          # then to the public contribution calendar.
          PROFILE_PAT: ${{ secrets.PROFILE_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-dynamic.js

      - name: Commit if changed
        run: |
          git add -A README.md assets
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile visuals [skip ci]"
          git push
